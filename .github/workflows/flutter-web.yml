# Forced fresh deployment
name: Build and Deploy Flutter Web

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/Campus_supply/"

      - name: Bust Flutter web asset caches
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path("build/web")
          build_id = os.environ["BUILD_SHA"][:12]
          index_path = root / "index.html"
          bootstrap_path = root / "flutter_bootstrap.js"

          # Version the bootstrap URL and the compiled Dart entrypoint URL.
          # Flutter versions differ in their generated build-config files, so
          # do not depend on flutter_build_config.json being present.
          html = index_path.read_text()
          html = html.replace(
              'src="flutter_bootstrap.js"',
              f'src="flutter_bootstrap.js?v={build_id}"',
          )
          index_path.write_text(html)

          if bootstrap_path.exists():
              bootstrap = bootstrap_path.read_text()
              for filename in ("main.dart.js", "main.dart.mjs", "main.dart.wasm"):
                  bootstrap = bootstrap.replace(
                      filename,
                      f"{filename}?v={build_id}",
                  )
              bootstrap_path.write_text(bootstrap)

          print(f"Cache-busted Flutter entrypoints for build {build_id}")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
