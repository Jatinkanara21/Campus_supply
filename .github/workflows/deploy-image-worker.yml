name: Deploy Campus Supply Image Worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-image-upload
          command: deploy
          secrets: |
            GITHUB_TOKEN
            ADMIN_UIDS
        env:
          GITHUB_TOKEN: ${{ secrets.CAMPUS_GITHUB_TOKEN }}
          ADMIN_UIDS: ${{ secrets.CAMPUS_ADMIN_UIDS }}
